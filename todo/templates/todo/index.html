<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="background-color: #f8f9fa;">
    <div class="container mt-4">
        <h1>{{ title }}</h1>
        <p>Total Todos: {{ todos_context.total }}</p>

        {{ todos_context | json_script:"todos_context" }}

        <div class="content-wrapper mt-4"></div>
    </div>

    <script>
        const getTodosData = async () => {
            const rawData = document.getElementById("todos_context").innerHTML;
            return Promise.resolve(JSON.parse(rawData));
        };

        const generateTodosTable = (todos) => {
            const table = $(`
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Title</th>
                        <th scope="col">Description</th>
                        <th scope="col">Created At</th>
                        <th scope="col">Updated At</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
            </table>
            `);
            const tbody = $(`<tbody></tbody>`);
            todos.forEach((todo, index) => {
                const isCompleted = todo.completed_at
                    ? 'style="background-color: #d4edda; color: #155724;"'
                    : 'style="background-color: #f8d7da; color: #721c24;"';
                const statusText = todo.completed_at ? "Completed" : "Pending";
                const tr = $(`
                    <tr ${isCompleted}>
                        <th scope="row">${index + 1}</th>
                        <td>${todo.title}</td>
                        <td>${todo.description}</td>
                        <td>${new Date(todo.created_at).toLocaleString()}</td>
                        <td>${new Date(todo.updated_at).toLocaleString()}</td>
                        <td>${statusText}</td>
                    </tr>
                `);
                tbody.append(tr);
            });

            const container = $(`
            <div class="container-fluid mt-3"> 
                <h2 style="color: #343a40;">Todo List</h2>
            </div>`);
            table.append(tbody);
            container.append(table);
            $(".content-wrapper").append(container);
        };

        window.onload = async () => {
            const data = await getTodosData();
            generateTodosTable(data.todos);
        };
    </script>
</body>
</html>
